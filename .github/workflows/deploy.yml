name: cicd_pilot-scraper

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUN_VERSION: "1.4.0"   # закрепите вашу версию

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock*') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile
      - run: bun test

  deploy:
    name: Build and deploy
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    timeout-minutes: 15
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    env:
      APP_DIR: /home/deployer/apps/pilot-bot
      DOCKER_BUILDKIT: 1
      COMPOSE_DOCKER_CLI_BUILD: 1

    steps:
      - uses: actions/checkout@v4

      - name: Create production environment
        env:
          ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}
        run: |
          test -n "$ENV_PRODUCTION" || { echo "ERROR: ENV_PRODUCTION secret is empty"; exit 1; }
          umask 077
          printf '%s\n' "$ENV_PRODUCTION" > .env.production.local

      - name: Build Docker image
        run: docker compose build pilot-bot

      # - name: Backup SQLite database
      #   run: |
      #     DB="$APP_DIR/data/schedule.sqlite"
      #     BACKUP_DIR="$APP_DIR/backups"
      #     BACKUP="$BACKUP_DIR/schedule-$(date '+%Y-%m-%d_%H-%M-%S').sqlite"

      #     [ -f "$DB" ] || { echo "ERROR: database not found: $DB"; exit 1; }
      #     mkdir -p "$BACKUP_DIR"

      #     # консистентная копия без остановки бота (учитывает WAL)
      #     sqlite3 "$DB" ".backup '$BACKUP'"

      #     [ -s "$BACKUP" ] || { echo "ERROR: backup is empty"; rm -f "$BACKUP"; exit 1; }
      #     ls -lh "$BACKUP"

      - name: Deploy
        run: docker compose up -d --remove-orphans

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail=100 pilot-bot || true

      # - name: Remove old database backups (keep 14)
      #   run: |
      #     ls -1t "$APP_DIR"/backups/schedule-*.sqlite 2>/dev/null \
      #       | tail -n +15 | xargs -r rm -f

      - name: Clean old Docker images
        run: docker image prune -f --filter "until=168h" || true

      - name: Remove env file
        if: always()
        run: rm -f .env.production.local